<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnostický test – PoraDys</title>
  <link rel="stylesheet" href="styles.css?v=3" />
  <style>
    /* Styly jen pro stránku diagnostiky */
    .diag-wrap { max-width: 860px; margin: 0 auto; padding: 18px 20px 60px; }
    .diag-top { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
    .diag-top h1 { margin: 0; font-size: 22px; color: var(--title); }
    .diag-top a { font-size: 13px; color: var(--accent); text-decoration: none; }
    .diag-top a:hover { text-decoration: underline; }
    .diag-sub { color: var(--muted); font-size: 13px; margin: 4px 0 10px; }

    .store-badge {
      display: inline-block;
      font-size: 11.5px;
      border-radius: 10px;
      padding: 2px 10px;
      margin-bottom: 12px;
      background: #eee;
      color: #555;
    }
    .store-badge.db { background: #e6f4ea; color: #1e6b30; }

    .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .tabs button {
      border: 1px solid var(--line-strong);
      background: #fff;
      border-radius: 6px 6px 0 0;
      padding: 9px 18px;
      font-size: 14px;
      cursor: pointer;
    }
    .tabs button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .diag-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 18px;
    }
    .diag-card h2 { margin: 0 0 12px; font-size: 16px; }

    .diag-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
    @media (max-width: 640px) { .diag-grid { grid-template-columns: 1fr; } }

    .score-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
    .score-row:last-child { border-bottom: none; }
    .score-row label { flex: 1; font-size: 13.5px; }
    .score-row .max { color: var(--muted); font-size: 12px; width: 64px; text-align: right; }
    .score-row input { width: 70px; border: 1px solid var(--line-strong); border-radius: 5px; padding: 6px 8px; font-size: 14px; text-align: right; }

    .diag-actions { display: flex; gap: 10px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
    .diag-error { color: #c62828; font-size: 13px; }

    /* Výsledek */
    .bars { margin: 8px 0 4px; }
    .bar-row { display: grid; grid-template-columns: 240px 1fr 60px; gap: 10px; align-items: center; margin-bottom: 7px; font-size: 13px; }
    @media (max-width: 640px) { .bar-row { grid-template-columns: 130px 1fr 50px; } }
    .bar-track { background: #eee; border-radius: 5px; height: 16px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 5px; }
    .bar-fill.weak { background: #c62828; }
    .bar-fill.mid { background: #ef6c00; }
    .bar-fill.strong { background: #2e7d32; }
    .bar-pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }

    .sw-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 640px) { .sw-cols { grid-template-columns: 1fr; } }
    .sw-cols h3 { margin: 0 0 8px; font-size: 14px; }
    .sw-cols ul { margin: 0; padding-left: 18px; font-size: 13.5px; }
    .sw-cols li { margin-bottom: 5px; }
    .sw-strong h3 { color: #2e7d32; }
    .sw-weak h3 { color: #c62828; }

    .plan-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .plan-table th, .plan-table td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .plan-table th { color: var(--muted); font-size: 12px; }
    .plan-summary { background: #f1f5fc; border: 1px solid #d6e2f6; color: #34507e; border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }

    .diag-note { font-size: 12px; color: var(--muted); }

    /* Historie a graf */
    .hist-chart { margin: 4px 0 14px; }
    .hist-chart svg { width: 100%; height: auto; display: block; }
    .history-row { display: flex; gap: 12px; align-items: center; padding: 7px 4px; border-bottom: 1px solid var(--line); font-size: 13px; }
    .history-row .h-date { color: var(--muted); width: 90px; flex: 0 0 auto; }
    .history-row .h-name { flex: 1; font-weight: 600; }
    .history-row .h-pct { width: 60px; text-align: right; font-variant-numeric: tabular-nums; }
    .history-row button { border: 1px solid var(--line-strong); background: #fff; border-radius: 4px; padding: 3px 9px; cursor: pointer; font-size: 12px; }

    @media print {
      .no-print { display: none !important; }
      .diag-card { border: none; padding: 0; }
      body { background: #fff; }
    }
  </style>
</head>
<body>
  <div class="diag-wrap">
    <div class="diag-top no-print">
      <h1>🧪 Diagnostický test</h1>
      <a href="index.html">← Zpět na rozvrh</a>
    </div>
    <p class="diag-sub no-print">
      Zadejte body žáka z diagnostického testu. Aplikace vyhodnotí silné a slabé
      stránky, sestaví plán přípravy na 8 týdnů a uloží výsledek k žákovi.
    </p>
    <span id="storeBadge" class="store-badge no-print">…</span>

    <div class="tabs no-print" id="subjectTabs"></div>

    <div class="diag-card no-print">
      <h2>Žák</h2>
      <div class="diag-grid">
        <div class="field"><label>Jméno žáka</label>
          <input type="text" id="dName" placeholder="Např. Novák Petr" list="studentsDatalist" />
          <datalist id="studentsDatalist"></datalist>
        </div>
        <div class="field"><label>Třída / ročník</label>
          <select id="dGrade">
            <option>1.–2. třída ZŠ</option>
            <option>3.–5. třída ZŠ</option>
            <option selected>6.–7. třída ZŠ</option>
            <option>8.–9. třída ZŠ (přijímačky)</option>
            <option>Střední škola</option>
          </select>
        </div>
        <div class="field"><label>Datum testu</label><input type="date" id="dDate" /></div>
        <div class="field"><label>Poznámka (nepovinné)</label><input type="text" id="dNote" placeholder="Např. dyslexie, doporučení PPP…" /></div>
      </div>
    </div>

    <div class="diag-card no-print">
      <h2 id="scoreTitle">Body z testu</h2>
      <div id="scoreRows"></div>
      <div class="diag-actions">
        <button id="evalBtn" style="background: var(--accent); color:#fff; border:none; border-radius:5px; padding:10px 18px; font-weight:600; cursor:pointer;">Vyhodnotit a sestavit plán</button>
        <span id="dError" class="diag-error"></span>
      </div>
    </div>

    <div id="resultCard" class="diag-card hidden">
      <h2 id="resTitle"></h2>
      <div id="resSummary" class="plan-summary"></div>
      <div id="resBars" class="bars"></div>
      <div id="resSW" class="sw-cols" style="margin-top:14px;"></div>
      <h2 style="margin-top:22px;">Plán přípravy na 8 týdnů</h2>
      <div id="resPlan"></div>
      <div class="diag-actions no-print">
        <button id="printBtn" style="border:1px solid var(--line-strong); background:#fff; border-radius:5px; padding:9px 14px; cursor:pointer;">🖨 Vytisknout</button>
        <button id="saveBtn" style="border:1px solid var(--line-strong); background:#fff; border-radius:5px; padding:9px 14px; cursor:pointer;">💾 Uložit k žákovi</button>
        <span id="saveInfo" style="color:#2e7d32; font-size:13px;"></span>
      </div>
    </div>

    <div class="diag-card no-print">
      <h2 id="histTitle">Historie testů</h2>
      <p id="histSub" class="diag-note" style="margin:0 0 10px;"></p>
      <div id="histChart" class="hist-chart"></div>
      <div id="historyList"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=3"></script>
  <script src="diagnostika.js?v=3"></script>
</body>
</html>
