# ---------------------------------------------------------------------------
# Nastavení hostingu na Netlify
# ---------------------------------------------------------------------------
# Appka je statická – nic se nebuilduje, servírují se soubory z kořene repa.
#
# Jediné, co tu opravdu řešíme, je CACHE. Sdílené soubory (app.js, styles.css…)
# se načítají s ?v=N v adrese, takže při změně čísla si prohlížeč stáhne novou
# verzi sám. Jenže samotné HTML žádné ?v= nemá – a právě ono to číslo nese.
# Když prohlížeč podá staré index.html z cache, přijdou s ním i staré odkazy
# a appka běží s kódem, který už dávno neplatí: uživatel vidí starou verzi
# a spraví to teprve ruční obnovení stránky.
#
# Proto se HTML musí u serveru vždycky ověřit. Je to jeden dotaz navíc,
# zpravidla s odpovědí 304 Not Modified, takže se stejně nic nestahuje.
#
# POZOR, ať to někdo nepovažuje za lék: Netlify tuhle hlavičku u HTML posílá
# i bez tohohle souboru (ověřeno měřením – `cache-control: public,max-age=0,
# must-revalidate`). Zdejší nastavení to jen zamyká, aby se to nezměnilo pod
# rukama. Když telefon ukazuje starou verzi, tímhle se to NESPRAVÍ – Safari
# obnovuje karty z minulé relace mimo HTTP cache a na hlavičky se přitom
# neptá. Jediné, co pomůže, je tu kartu zavřít nebo stránku otevřít na
# adrese, kterou prohlížeč ještě neviděl.
# ---------------------------------------------------------------------------

[build]
  publish = "."

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Kořenová adresa (poradys.netlify.app/) servíruje index.html, ale pravidlu
# výš neodpovídá, protože v cestě žádné ".html" není.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
